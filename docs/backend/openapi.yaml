components:
  schemas:
    Int64String:
      type: string
      maxLength: 20
      pattern: ^-?(0|[1-9][0-9]*)$
      description: Signed BIGINT decimal string; server additionally validates int64 range.
    CountString:
      type: string
      maxLength: 20
      pattern: ^(0|[1-9][0-9]*)$
      description: Nonnegative integer count as decimal string.
    RunId:
      type: string
      maxLength: 19
      pattern: ^[1-9][0-9]*$
      description: Generated positive BIGINT identity.
    Sha256:
      type: string
      maxLength: 64
      minLength: 64
      pattern: ^[0-9a-f]{64}$
    ScoreType:
      type: string
      enum:
      - SAY
      - EA
      - SÖZ
      - DİL
      - TYT
    Warning:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 80
          minLength: 1
        message:
          type: string
          maxLength: 500
        reference_year:
          type:
          - integer
          - 'null'
          minimum: 1000
          maximum: 9999
      required:
      - code
      - message
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              maxLength: 80
              minLength: 1
            message:
              type: string
              maxLength: 500
            request_id: *id008
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  field:
                    type: string
                    maxLength: 160
                  reason:
                    type: string
                    maxLength: 160
                required:
                - field
                - reason
              maxItems: 20
          required:
          - code
          - message
          - request_id
          - details
      required:
      - error
    Health:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - live
          - ready
          - not_ready
      required:
      - status
    ReadMeta:
      type: object
      additionalProperties: false
      properties:
        publication_id: *id008
        published_at: &id011
          type: string
          format: date-time
        requested_year:
          type:
          - integer
          - 'null'
          minimum: 1000
          maximum: 9999
        available_years:
          type: array
          items: *id010
          maxItems: 100
          uniqueItems: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          maxItems: 20
      required:
      - publication_id
      - published_at
      - requested_year
      - available_years
      - warnings
    Page:
      type: object
      additionalProperties: false
      properties:
        total_count:
          $ref: '#/components/schemas/CountString'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 4096
      required:
      - total_count
      - limit
      - next_cursor
    University:
      type: object
      additionalProperties: false
      properties:
        universite_id:
          $ref: '#/components/schemas/Int64String'
        universite_adi:
          type: string
          maxLength: 1000
