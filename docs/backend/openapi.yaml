      operationId: live
      summary: Process liveness
      description: Process liveness
      tags:
      - health
      security: []
      parameters: []
      responses:
        '200':
          description: Process alive.
          headers:
            X-Request-ID: &id001
              description: Server correlation UUID; no secret information.
              schema: &id008
                type: string
                format: uuid
            Cache-Control: &id002
              description: Public reads max-age=60 first-cut; private and errors no-store.
              schema:
                type: string
                maxLength: 128
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: Sanitized unexpected internal error.
          headers:
            X-Request-ID: *id001
            Cache-Control: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-implementation-status: planned
      x-implementation-phase: 2
      x-actors:
      - anonymous reader
      x-required-scopes: []
      x-object-authorization: No protected object.
      x-data-layer: health
      x-transaction: No SQL writes.
      x-idempotency: Not a mutation receipt key; read or claim protocol.
      x-observability: Request ID, operation, authorized actor/source, duration and safe outcome; never body/secret.
      x-tests:
        normal: live-normal
        invalid: live-invalid
        auth: live-anonymous-and-no-sensitive-fields
        repeat: live-repeat-read-or-claim
        concurrent: live-concurrent
